<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table id="tabNum0"></table>
    <table id="tabNum1"></table>
    <table id="tabNum2"></table>
    <table id="tabNum3"></table>
    <table id="tabNum4"></table>
    <table id="tabNum5"></table>
</body>
</html>
<script>
    //executa a função após o
    window.onload = montaTabelas;

    function montaTabelas(){
        for(contNum = 1; contNum <= 63; contNum++){
            restoDiv = contNum;//inicializador

            for(cont2 = 5; cont2 >= 0; cont2--) {
                if(Math.floor(restoDiv / Math.pow(2, cont2)) == 1) {
                    document.getElementById("tabNum" + cont2).innerHTML
                    += "<td>" + contNum + "</td>";
                }
            }
            restoDiv = restoDiv % Math.pow(2,cont2);
        }
    }
</script>
