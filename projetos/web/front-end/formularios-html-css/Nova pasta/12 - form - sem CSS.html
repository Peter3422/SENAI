<!DOCTYPE HTML>

<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<title>HTML e CSS para Formulários</title>
</head>

<body>

<h1>Formulário de Cadastro</h1>

<form action="#" method="post">
	
	<fieldset> <legend> Nome e Sobrenome </legend>
		<div>
			<label for="nome"> Nome </label>
			<input type="text" 
			       id="nome" 
				   name="nome" 
				   style="width: 30em" 
				   value="" />
		</div>
		<div>
			<label for="sobrenome">Sobrenome</label>
			<input type="text" 
			       id="snome" 
				   name="snome" 
				   style="width: 30em" 
				   value="" />
		</div>
	</fieldset>	

	<p> </p>

	<fieldset> <legend>Genero</legend>
		<div> 
			<label>
				<input type="radio" name="genero" value="masculino"> Masculino
			</label>
			
			<label>
				<input type="radio" name="genero" value="feminino"> Feminino
			</label>
		</div>
    </fieldset>

	<p> </p>

	<fieldset> <legend>E-mail e Telefone</legend>
		<div>
			<label for="email">E-mail</label>
			<input type="text" 
				   id="email" 
				   name="email" 
				   style="width: 30em" 
				   value="" />
		</div>
		<div>
			<label for="telefone">Telefone</label>
			<input type="text" 
			       id="telefone" 
				   name="telefone" 
				   style="width: 30em"  
				   value="" />
		</div>
	</fieldset>

	<p> </p>
	
	<fieldset> <legend> Cidade e Estado </legend>
		<div >
			<label for="cidade">Cidade</label>
			<input type="text" 
			       id="cidade"
				   name="cidade" 
				   style="width: 20em" 
			       value="" />
		</div>

		<div>
			<label for="estado">Estado</label>
			<select name="estado" id="estado">
				<option value="PR">PR</option>
				<option value="SP">SP</option>
			</select>
		</div>
	</fieldset>

	<p> </p>
	
	<fieldset> <legend>Mensagem</legend>
		<div >
			<label for="mensagem">Mensagem</label>
			<textarea rows="6" 
			          style="width: 41em" 
					  id="mensagem" 
					  name="mensagem"> </textarea>
		</div>

		<div>
			<label>Newsletter</label>

			<label>
				<input type="checkbox" name="newsletter" value="1"> 
				  Gostaria de receber a Newsletter da empresa
			</label>

		</div>
		<div>
			<button type="submit" name="submit"> Enviar </button> <br>
			<button type="reset"  name="reset" > Limpar </button>
		</div>
	</fieldset>
</form>
</body>
</html>
