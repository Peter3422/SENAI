<html>
<head>
    <title>JavaScript - Funções</title>
<script language="javascript">
    function azul(){
        document.bgColor='blue';
    }
    function vermelho(){
        document.bgColor='red';
    }
    function amarelo(){
        document.bgColor='yellow';
    }
    function verde(){
        document.bgColor='greem';
    }
    function roxo(){
        document.bgColor='purple';
    }
    function laranja(){
        document.bgColor='orange';
    }
    function azulc(){
        document.bgColor='cyan';
    }
    </script>
</head>
<body>
    <form name="formulario">
        <input type="button" onclick="azul()" value="azul"> <!--onclick(quando clicado) ir para função criada em js, value=o que aparece em nome do botão-->
        <input type="button" onclick="amarelo()" value="amarelo">
        <input type="button" onclick="vermelho()" value="vermelho">
        <input type="button" onclick="verde()" value="verde"> 
        <input type="button" onclick="roxo()" value="roxo">
        <input type="button" onclick="laranja()" value="laranja">
        <input type="button" onclick="azulc()" value="ciano"> 
    </form>
</body>
</html>
