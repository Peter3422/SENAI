<html>
<head>
    <title>JavaScript - Variaveis</title>

<script language="javascript">
//entrada de dados
x = prompt('Entre com o valor 1','digite aqui');
y = prompt('Entre com o valor 2','digite aqui');
//so utiliza-se a função parseInt quando o operador for "+"
    //processamento
    resultado=parseInt(x)+parseInt(y);
    //saida
    alert(resultado);
    </script>
</head>

</body>
</html>
