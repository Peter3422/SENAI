<html>
<head>
    <title>JavaScript - Tabuada</title>

<script language="javascript">
//entrada
    valor= prompt("digite a tabuada desejada","")//o "" vazio é o que tem dentro da area de escria

    //processamento
    for(x=0; x<11; x++)
    {
        //saidas
        document.write("<br>"+valor+" x "+x+" = "+valor*x)
    }
    </script>
</head>

</body>
</html>
