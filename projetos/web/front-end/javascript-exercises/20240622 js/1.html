<html>
<head>
    <title>JavaScript - Operações com variavel</title>

<script language="JavaScript">
x=10;
y=2;

    resultado=x+y;
    document.write(x+"+"+y+"="+resultado+"<br>");

    resultado=x-y;
    document.write(x+"-"+y+"="+resultado+"<br>");

    resultado=x*y;
    document.write(x+"*"+y+"="+resultado+"<br>");

    resultado=x/y;
    document.write(x+"/"+y+"="+resultado+"<br>");
    
    </script>
</head>
<body>
    
</body>
</html>
