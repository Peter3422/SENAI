<html>
<head>
    <title>JavaScript - Circulo</title>

<script language="JavaScript">
    //entrada
    raio=parseFloat(prompt('insira o valor do raio','use em cm'))

    //processamento
    area = ((raio*raio)*Math.PI)
    alert('area é: ' + area)

    //saida
    document.write('A area do circulo é: ' + area)
    </script>
</head>
<body>
    
</body>
</html>
