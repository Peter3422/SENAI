<html>
<head>
    <title>JavaScript - Variaveis</title>

<script language="javascript">
let x, y, resultado;

while(true) {
    x = parseInt(prompt('Entre com o valor 1', 'digite aqui'));
    y = parseInt(prompt('Entre com o valor 2', 'digite aqui'));

    if (!isNaN(x) && !isNaN(y)) {
        resultado = x + y;
        alert(`O resultado é: ${resultado}`);
    } else {
        alert('Por favor, insira apenas números.');
    }
}
    </script>
</head>

</body>
</html>
