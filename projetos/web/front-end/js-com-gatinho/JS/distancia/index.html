<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Milhas para Quilômetros</title>
    <style>
        #voltar-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #cat {
            position: fixed;
            width: 50px; /* Ajuste o tamanho conforme necessário */
            height: 50px; /* Ajuste o tamanho conforme necessário */
            pointer-events: none; /* Para que o gato não interfira nos eventos do mouse */
        }
    </style>
</head>
<body>
    <h1>Conversor de Milhas para Quilômetros</h1>
    <form id="conversorForm">
        <label for="milhas">Distância em Milhas:</label>
        <input type="number" id="milhas" step="0.01" required><br><br>
        
        <button type="button" onclick="converterDistancia()">Converter</button>
    </form>
    <div id="resultado"></div>

    <button id="voltar-btn" onclick="voltar()">Voltar</button>

    <script src="styles.js"></script>
    <img id="cat" src="/JS/vecteezy_realistic-cute-cat-cartoon-style-digital-artwork_21830103.png" alt="Gato seguindo o mouse">
    <script>
        function voltar() {
            window.history.back();
        }

        const cat = document.getElementById('cat');
        let mouseX = 0;
        let mouseY = 0;

        // Atualiza a posição do mouse
        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX;
            mouseY = event.clientY;
        });

        function animate() {
            // Posição atual do gato
            const catX = parseFloat(cat.style.left) || 0;
            const catY = parseFloat(cat.style.top) || 0;

            // Cálculo da diferença e suavização do movimento
            const dx = (mouseX - catX) * 0.05; // Reduzido para 0.05 para um movimento mais suave
            const dy = (mouseY - catY) * 0.05; // Reduzido para 0.05 para um movimento mais suave

            // Atualiza a posição do gato
            cat.style.left = `${catX + dx}px`;
            cat.style.top = `${catY + dy}px`;

            requestAnimationFrame(animate); // Chama a função novamente para continuar a animação
        }

        animate(); // Inicia a animação
    </script>
</body>
</html>
