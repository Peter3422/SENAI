<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Conversão</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        #cat {
            position: fixed;
            width: 50px; /* Ajuste o tamanho conforme necessário */
            height: 50px; /* Ajuste o tamanho conforme necessário */
            pointer-events: none; /* Para que o gato não interfira nos eventos do mouse */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Exercícios de Conversão</h1>
        <div class="button-grid">
            <a href="conversor/index.html" class="btn">Dólar para Real</a>
            <a href="temperatura/index.html" class="btn">Fahrenheit para Celsius</a>
            <a href="distancia/index.html" class="btn">Milhas para Quilômetros</a>
            <a href="media/index.html" class="btn">Calculadora de Média</a>
            <a href="carro/index.html" class="btn">Custo de Carro</a>
            <a href="ipi/index.html" class="btn">Cálculo de IPI</a>
        </div>
    </div>

    <!-- Div para o gato com imagem -->
    <img id="cat" src="vecteezy_realistic-cute-cat-cartoon-style-digital-artwork_21830103.png" alt="Gato seguindo o mouse">

    <script>
        const cat = document.getElementById('cat');
        let mouseX = 0;
        let mouseY = 0;

        // Atualiza a posição do mouse
        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX;
            mouseY = event.clientY;
        });

        function animate() {
            // Posição atual do gato
            const catX = parseFloat(cat.style.left) || 0;
            const catY = parseFloat(cat.style.top) || 0;

            // Cálculo da diferença e suavização do movimento
            const dx = (mouseX - catX) * 0.05; // Reduzido para 0.05 para um movimento mais suave
            const dy = (mouseY - catY) * 0.05; // Reduzido para 0.05 para um movimento mais suave

            // Atualiza a posição do gato
            cat.style.left = `${catX + dx}px`;
            cat.style.top = `${catY + dy}px`;

            requestAnimationFrame(animate); // Chama a função novamente para continuar a animação
        }

        animate(); // Inicia a animação
    </script>
</body>
</html>
